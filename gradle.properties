pluginGroup = com.leyline.crucible
pluginName = Crucible
pluginRepositoryUrl = https://github.com/Operation-Leyline/crucible-intellij
pluginVersion = 0.2.0

# The oldest IDE build the plugin supports: 2026.2, for the platform LSP client API.
pluginSinceBuild = 262

# The IDE the plugin compiles and tests against. RustRover rather than IntelliJ
# IDEA: IDEA's licensing component cannot start in the platform test framework.
# Set platformLocalPath (for example in ~/.gradle/gradle.properties) to use an
# installed IDE instead of downloading one.
platformType = RR
platformVersion = 2026.2.3

# The Crucible release whose crucible-lsp binaries are bundled.
crucibleVersion = 0.6.0

org.gradle.configuration-cache = true
org.gradle.caching = true
kotlin.stdlib.default.dependency = false
